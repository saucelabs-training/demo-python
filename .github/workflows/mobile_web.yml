name: Mobile Web Tests

on:
  push:
    branches:
        - main
    paths:
      - 'best_practice/mobile_web/**'
      - '.github/workflows/mobile_web.yml'
  pull_request:
    branches:
        - main
    paths:
      - 'best_practice/mobile_web/**'
      - '.github/workflows/mobile_web.yml'
  schedule:
    - cron: "0 9 * * *"

jobs:
  python-tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: best_practice/mobile_web
    strategy:
      fail-fast: false
      matrix:
        test: [ best-practice-mobile-web-vdc-us, best-practice-mobile-web-rdc-us]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install dependencies
        run: pipenv install --python "${{ steps.setup-python.outputs.python-path }}"
      - name: Run Desktop Best Practice Tests
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: pipenv run ${{ matrix.test }}
