name: Selenium Demo Tests

on:
  push:
    branches:
        - main
    paths:
      - 'examples/selenium/**'
      - '.github/workflows/selenium_demo.yml'
  pull_request:
    branches:
        - main
    paths:
      - 'examples/selenium/**'
      - '.github/workflows/selenium_demo.yml'
  schedule:
    - cron: "0 9 * * *"

jobs:
  python-tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/selenium

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install dependencies
        run: pipenv install --python "${{ steps.setup-python.outputs.python-path }}"
      - name: Run demo tests
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: pipenv run demo
